services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: crypto-app
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - crypto-internal
      - caddy-net

  mongodb:
    image: mongo:7
    container_name: crypto-mongodb
    restart: unless-stopped
    # Cap the WiredTiger cache at 2 GB (the default takes about half of RAM, 3.5 GB here), so research containers on
    # the same host keep their headroom. The entrypoint prepends mongod and adds --auth.
    command: ["--wiredTigerCacheSizeGB", "2"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER:-appuser}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-apppassword}
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - crypto-internal

  redis:
    image: redis:7-alpine
    container_name: crypto-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crypto-internal

  cron:
    image: alpine:3.20
    container_name: crypto-cron
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/cron-entrypoint.sh"]
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET}
    volumes:
      - ./docker/crontab.template:/etc/crontab.template:ro
      - ./docker/cron-entrypoint.sh:/etc/cron-entrypoint.sh:ro
    healthcheck:
      # pgrep alone only proves crond is alive; the mtime check proves jobs are
      # actually firing, which also catches a crond running an empty or
      # malformed crontab. Two jobs run every minute and every line redirects
      # both streams into this file, so 300s is roughly five missed ticks.
      #
      # Plain compose does not restart an unhealthy container: this buys
      # `docker ps` showing (unhealthy), which is the inspectability that was
      # missing. The entrypoint's PID-1 change is what actually restarts it.
      test:
        - CMD-SHELL
        - pgrep crond >/dev/null && [ $$(( $$(date +%s) - $$(stat -c %Y /var/log/cron.log) )) -lt 300 ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      - app
    networks:
      - crypto-internal

  # Forward-only Binance liquidation and trade-flow recorder
  # (scripts/ops/market-recorder.ts). Research data: no study may read it
  # before its own pre-registration. Built from the seeder stage because it
  # runs TypeScript through tsx, like the ops scripts.
  #
  # Egress: crypto-internal is a plain bridge network (not `internal: true`),
  # so containers on it reach the internet through Docker's NAT; the ops
  # recipe's `docker run --network crypto_crypto-internal` ingest jobs already
  # download from Binance that way.
  #
  # Every image change (any commit, since the stage copies the whole repo)
  # recreates this container on deploy, which the recorder logs as a gap.
  recorder:
    build:
      context: .
      dockerfile: Dockerfile
      target: seeder
    container_name: crypto-recorder
    restart: unless-stopped
    env_file: .env
    environment:
      # Heap below the container limit, so V8 collects before the kernel kills.
      NODE_OPTIONS: --max-old-space-size=384
    # tsx is a pinned devDependency (package-lock.json, installed by `npm ci`
    # in the deps stage), so the service runs the image's own copy and never
    # downloads code from the registry at start (supply-chain review, 2026-10-08).
    command: ["node_modules/.bin/tsx", "scripts/ops/market-recorder.ts"]
    # tini as PID 1, so SIGTERM reaches the recorder through npx and tsx.
    init: true
    # Time for the shutdown flush (bounded at 20 s in the recorder).
    stop_grace_period: 30s
    mem_limit: 512m
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - crypto-internal
    # The other services set no rotation and rely on the daemon default; this
    # one logs a line a minute for months, so it is bounded here.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Forward-only order book and trade tape for Lighter and the matching Binance
  # USDT-M perps (scripts/ops/tape-recorder.ts). Research data: no study may
  # read it before its own pre-registration. Standalone: no MongoDB, no Redis,
  # no .env (it needs no secret), so it sits on its own bridge network and only
  # reaches the internet through Docker's NAT.
  #
  # Host paths (create them before the first start; the tape folder must be
  # writable by uid 1000, which is the container user):
  #   TAPE_HOST_DIR           default /home/smara/lighter-track/tape, receives the
  #                           dated folders, gaps.jsonl and heartbeat.json. Back it up
  #                           and prune it from the host; nothing here deletes data.
  #   TAPE_MARKETS_HOST_FILE  default /home/smara/lighter-track/tools/tape-markets.json,
  #                           the markets list, mounted read-only. The recorder validates
  #                           it at start and fails loudly if it is missing or invalid.
  #
  # Hardening: non-root user, no capabilities, no privilege escalation, a read-only
  # root filesystem (tsx and node write only under the /tmp tmpfs; HOME and the
  # cache dirs point there), process and CPU limits. The recorder stops writing
  # rows when the tape volume has less than TAPE_MIN_FREE_GB (default 10) free.
  #
  # Every image change recreates this container on deploy, which the recorder
  # logs as a process-start gap in gaps.jsonl.
  tape:
    build:
      context: .
      dockerfile: Dockerfile
      target: seeder
    container_name: crypto-tape
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 1
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      HOME: /tmp
      TMPDIR: /tmp
      XDG_CACHE_HOME: /tmp
      TAPE_DIR: /tape
      TAPE_MARKETS_FILE: /config/markets.json
    command: ["node_modules/.bin/tsx", "scripts/ops/tape-recorder.ts"]
    init: true
    # Time for the shutdown flush (bounded at 20 s in the recorder).
    stop_grace_period: 30s
    mem_limit: 512m
    volumes:
      - ${TAPE_HOST_DIR:-/home/smara/lighter-track/tape}:/tape
      - ${TAPE_MARKETS_HOST_FILE:-/home/smara/lighter-track/tools/tape-markets.json}:/config/markets.json:ro
    networks:
      - tape-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongodb_data:
  redis_data:

networks:
  crypto-internal:
    driver: bridge
  # The tape recorder needs neither MongoDB nor Redis.
  tape-net:
    driver: bridge
  caddy-net:
    external: true
