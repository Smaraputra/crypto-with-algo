services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_BINANCE_WS_URL: ${NEXT_PUBLIC_BINANCE_WS_URL:-wss://stream.binance.com:9443}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: crypto-app
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - crypto-internal
      - caddy-net

  mongodb:
    image: mongo:7
    container_name: crypto-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER:-appuser}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-apppassword}
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - crypto-internal

  redis:
    image: redis:7-alpine
    container_name: crypto-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crypto-internal

  cron:
    image: alpine:3.20
    container_name: crypto-cron
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/cron-entrypoint.sh"]
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET}
    volumes:
      - ./docker/crontab.template:/etc/crontab.template:ro
      - ./docker/cron-entrypoint.sh:/etc/cron-entrypoint.sh:ro
    healthcheck:
      # pgrep alone only proves crond is alive; the mtime check proves jobs are
      # actually firing, which also catches a crond running an empty or
      # malformed crontab. Two jobs run every minute and every line redirects
      # both streams into this file, so 300s is roughly five missed ticks.
      #
      # Plain compose does not restart an unhealthy container: this buys
      # `docker ps` showing (unhealthy), which is the inspectability that was
      # missing. The entrypoint's PID-1 change is what actually restarts it.
      test:
        - CMD-SHELL
        - pgrep crond >/dev/null && [ $$(( $$(date +%s) - $$(stat -c %Y /var/log/cron.log) )) -lt 300 ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      - app
    networks:
      - crypto-internal

volumes:
  mongodb_data:
  redis_data:

networks:
  crypto-internal:
    driver: bridge
  caddy-net:
    external: true
